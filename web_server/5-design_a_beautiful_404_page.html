<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
body {
margin: 0;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
text-align: center;
font-family: Georgia, "Times New Roman", serif;
background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
color: #f5f5f5;
overflow: hidden;
}
.scene { position: relative; padding: 2rem; }
.giant {
font-size: clamp(7rem, 28vw, 16rem);
font-weight: bold;
line-height: 1;
margin: 0;
letter-spacing: 0.05em;
color: #fff;
text-shadow: 0.04em 0.04em 0 #ff2a6d, -0.04em -0.04em 0 #05d9e8;
animation: jitter 3.2s infinite steps(2, end);
}
@keyframes jitter {
0%, 92%, 100% { transform: translate(0, 0); }
94% { transform: translate(-4px, 2px); }
96% { transform: translate(3px, -3px); }
98% { transform: translate(-2px, -1px); }
}
.phrase {
font-size: clamp(1.2rem, 4vw, 2rem);
font-style: italic;
margin: 1.2rem 0 0.4rem;
color: #ffd369;
}
.attribution {
font-size: 0.95rem;
color: #9fb3c8;
margin: 0;
}
.hint {
display: inline-block;
margin-top: 2.2rem;
padding: 0.55rem 1.4rem;
border: 1px solid #05d9e8;
border-radius: 999px;
color: #05d9e8;
text-decoration: none;
font-family: "Courier New", monospace;
font-size: 0.9rem;
letter-spacing: 0.12em;
transition: background 0.25s, color 0.25s;
}
.hint:hover { background: #05d9e8; color: #24243e; }
.balloon {
position: absolute;
width: 26px;
height: 34px;
border-radius: 50% 50% 48% 48%;
background: #ff2a6d;
top: -4.5rem;
left: 12%;
animation: float 5s ease-in-out infinite;
}
.balloon::after {
content: "";
position: absolute;
top: 34px;
left: 12px;
width: 1px;
height: 55px;
background: rgba(255, 255, 255, 0.45);
}
@keyframes float {
0%, 100% { transform: translateY(0) rotate(-4deg); }
50% { transform: translateY(-16px) rotate(5deg); }
}
</style>
</head>
<body>
<main class="scene">
<div class="balloon" aria-hidden="true"></div>
<p class="giant">404</p>
<p class="phrase">Ceci n'est pas une page</p>
<p class="attribution">"This is not a page." &mdash; surely said someone important, once upon a 404.</p>
<a class="hint" href="/">BACK TO REALITY</a>
</main>
</body>
</html>
